name: Commercial readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install controlled Chromium
        run: npx playwright install --with-deps chromium

      - name: Run commercial readiness gate
        run: npm run check:commercial-readiness

      - name: Install controlled Office renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer poppler-utils fonts-noto-cjk

      - name: Render formal Word template
        run: npm run check:docx-visual-render -- --output-dir=docx-visual-artifacts

      - name: Upload Word visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: molinword-docx-visual-${{ github.sha }}
          path: docx-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
